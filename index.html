<style>
  :root{
    --ink:#000000;
    --bg:#faf9f6;
    --primary:#52b788;
    --primary-dark:#2d6a4f;
    --accent:#f4d35e;
    --success:#38b000;
    --error:#e63946;
    --card:#ffffff;
    --shadow-offset: 4px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:'Rubik',system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .stage-root{
    width:100%;
    max-width:420px;
  }
  .brut{
    border:3px solid var(--ink);
    border-radius:14px;
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
    background:var(--card);
  }
  .btn{
    font-family:inherit;
    font-weight:700;
    font-size:17px;
    border:3px solid var(--ink);
    border-radius:12px;
    padding:14px 22px;
    background:var(--accent);
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
    cursor:pointer;
    transition: transform .08s ease, box-shadow .08s ease;
    color:var(--ink);
    width:100%;
  }
  .btn:active{
    transform: translate(4px,4px);
    box-shadow: 0 0 0 var(--ink);
  }
  .btn.secondary{ background:var(--card); }
  .btn.success{ background:var(--success); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .screen{ display:none; }
  .screen.active{ display:block; animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Splash ---------- */
  #screen-start .panel{
    padding:36px 26px;
    text-align:center;
    background: var(--primary);
  }
  #screen-start h1{
    font-size:34px;
    font-weight:900;
    line-height:1.15;
    margin:0 0 10px;
    color:#fff;
    text-shadow: 2px 2px 0 var(--primary-dark);
  }
  #screen-start p{
    font-size:15px;
    font-weight:500;
    color:#eafff3;
    margin:0 0 26px;
  }
  .veg-row{
    font-size:44px;
    margin-bottom:18px;
    display:flex;
    justify-content:center;
    gap:14px;
  }
  .veg-row span{ display:inline-block; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 2px;
  }
  .pips{ display:flex; gap:6px; }
  .pip{
    width:16px;height:16px;
    border:2px solid var(--ink);
    border-radius:4px;
    background:#fff;
  }
  .pip.done{ background:var(--primary); }
  .pip.current{ background:var(--accent); }
  .mute-btn{
    width:34px;height:34px;
    border:2px solid var(--ink);
    border-radius:8px;
    background:#fff;
    box-shadow:2px 2px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
  }

  /* ---------- Gameplay ---------- */
  .badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    background:var(--accent);
    border:2px solid var(--ink);
    border-radius:20px;
    padding:3px 12px;
    margin-bottom:10px;
  }
  #stage-title{
    font-size:21px;
    font-weight:900;
    margin:0 0 16px;
    line-height:1.3;
  }
  .cards-row{
    display:flex;
    gap:12px;
    margin-bottom:18px;
  }
  .item-card{
    flex:1;
    aspect-ratio: 1 / 1.15;
    border:3px solid var(--ink);
    border-radius:14px;
    background:#fff;
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:8px;
    transition: transform .12s ease;
    cursor:pointer;
  }
  .item-card.selected{
    outline:none;
    border-color: var(--primary-dark);
    background:#eafff3;
  }
  .item-card .art{
    width:100%;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    overflow:hidden;
    border-radius:8px;
    background: #f0f0f0;
  }
  .item-card .art img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:8px;
  }
  .item-card .tag{
    margin-top:8px;
    font-size:13px;
    font-weight:700;
    border:2px dashed #bbb;
    border-radius:8px;
    padding:5px 8px;
    width:90%;
    text-align:center;
    color:#999;
    background:#fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-card .tag.filled{
    border:2px solid var(--ink);
    color:var(--ink);
    background:var(--accent);
  }
  .item-card.correct{ animation: bounce .5s ease; border-color: var(--success); }
  .item-card.wrong{ animation: shake .45s ease; border-color: var(--error); }

  /* ---------- Single image mode styles ---------- */
  .single-image-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1.35;
    border:3px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--ink);
    margin-bottom:18px;
  }
  .single-image-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .face-target{
    position:absolute;
    border:3px dashed #fff;
    border-radius:12px;
    background: rgba(0,0,0,0.22);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:6px;
    cursor:pointer;
    transition: transform .1s ease, border-color .15s ease, background-color .15s ease;
  }
  .face-target:hover{
    background: rgba(0,0,0,0.35);
  }
  .face-target.selected{
    border-color: var(--accent);
    background: rgba(244, 211, 94, 0.25);
  }
  .face-target .tag{
    font-size:12px;
    font-weight:700;
    border:2px solid var(--ink);
    border-radius:8px;
    padding:4px 6px;
    width:100%;
    text-align:center;
    color:var(--ink);
    background:#fff;
    box-shadow: 2px 2px 0 var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .face-target .tag.filled{
    background:var(--accent);
  }
  .face-target.correct{ animation: bounce .5s ease; border-color: var(--success); }
  .face-target.wrong{ animation: shake .45s ease; border-color: var(--error); }

  @keyframes bounce{
    0%{transform:scale(1);} 30%{transform:scale(1.08);} 55%{transform:scale(.97);} 100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:6px;
  }
  .chip{
    font-weight:700;
    font-size:15px;
    border:3px solid var(--ink);
    border-radius:24px;
    padding:10px 18px;
    background:#fff;
    box-shadow: 3px 3px 0 var(--ink);
    cursor:pointer;

  }

  .hint{
    text-align:center;
    font-size:13px;
    color:#666;
    margin-top:6px;
    min-height:16px;
  }

  #screen-feedback .panel{ padding:28px 22px; text-align:center; }
  .result-emoji{ font-size:56px; margin-bottom:6px; }

  #feedback-line{ font-size:15px; font-weight:500; margin:0 0 18px; line-height:1.5; }
  .funfact-box{
    background:#fff8e1;
    border:2px solid var(--ink);
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    text-align:right;
    margin-bottom:20px;
    line-height:1.5;
  }
  .funfact-box b{ display:block; margin-bottom:4px; }
  .funfact-note{ margin-top:8px; font-size:11px; color:#999; text-align:center; }

  /* ---------- Results ---------- */
  #screen-results .panel{ padding:32px 24px; text-align:center; background: var(--primary-dark); }
  #screen-results h2{ color:#fff; font-size:26px; font-weight:900; margin:0 0 4px; }
  #screen-results .score{ color:var(--accent); font-size:44px; font-weight:900; margin:6px 0 2px; }
  #screen-results .score-label{ color:#e7fff2; font-size:13px; margin-bottom:18px; }
  #results-title{
    background:#fff; color:var(--ink);
    display:inline-block;
    border:3px solid var(--ink);
    border-radius:10px;
    padding:10px 16px;
    font-weight:700;
    font-size:16px;
    margin-bottom:22px;
    box-shadow: 3px 3px 0 #000;
  }
  .results-actions{ display:flex; flex-direction:column; gap:10px; }

  .content-note{
    margin-top:14px;
    text-align:center;
    font-size:11.5px;
    color:#999;
  }
</style>
</head>

<script>
/* =====================================================================

  },
  {

    categoryBadge: "קלאסיקה ישראלית",
    itemA: { id: "A", name: "חני נחמיאס", imageUrl: "images/hani_nahmias.jpg", emoji: "📺", focus: "center top" },
    itemB: { id: "B", name: "גלי עטרי", imageUrl: "images/gali_atari.jpg", emoji: "🎤", focus: "center top" },
    transition: {

/* ===================================================================== */

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildGameLevels(){
  const regular = STAGE_POOL.filter(l => !l.alwaysLast);
  const pinnedLast = STAGE_POOL.filter(l => l.alwaysLast);
  return [...regular, ...pinnedLast];
}

const els = {
  start: document.getElementById('screen-start'),
  play: document.getElementById('screen-play'),
  feedback: document.getElementById('screen-feedback'),
  results: document.getElementById('screen-results'),
  pips: document.getElementById('pips'),
  stageBadge: document.getElementById('stage-badge'),
  stageTitle: document.getElementById('stage-title'),
  stageContent: document.getElementById('stage-content'),
  chipsRow: document.getElementById('chips-row'),
  hint: document.getElementById('hint'),
  feedbackEmoji: document.getElementById('feedback-emoji'),
  feedbackTitle: document.getElementById('feedback-title'),
  feedbackLine: document.getElementById('feedback-line'),
  funfactBox: document.getElementById('funfact-box'),
  funfactLabel: document.getElementById('funfact-label'),
  funfactText: document.getElementById('funfact-text'),
  funfactNote: document.getElementById('funfact-note'),
  finalScore: document.getElementById('final-score'),
  resultsTitle: document.getElementById('results-title'),
  muteBtn: document.getElementById('btn-mute'),
};

let state = {
  screen: 'START_SCREEN',
  levels: [],
  stageIndex: 0,
  score: 0,
  selectedChip: null,
  slots: [],
  locked: false,
  muted: false,
};

function showScreen(name){
  [els.start, els.play, els.feedback, els.results].forEach(s=>s.classList.remove('active'));
  ({START_SCREEN:els.start, PLAYING:els.play, STAGE_FEEDBACK:els.feedback, GAME_OVER:els.results})[name].classList.add('active');
  state.screen = name;
}

/* ---------- SFX ---------- */
let audioCtx = null;
function beep(freq, dur, type='sine'){
  if(state.muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
const sfx = {
  click: ()=>beep(420,.06,'square'),
  correct: ()=>{beep(520,.12); setTimeout(()=>beep(780,.16),90);},
  wrong: ()=>beep(140,.25,'sawtooth'),
};

els.muteBtn.addEventListener('click', ()=>{
  state.muted = !state.muted;
  els.muteBtn.textContent = state.muted ? '🔇' : '🔊';
});

function renderPips(){
  els.pips.innerHTML = '';
  state.levels.forEach((_,i)=>{
    const p = document.createElement('div');
    p.className = 'pip' + (i < state.stageIndex ? ' done' : (i === state.stageIndex ? ' current' : ''));
    els.pips.appendChild(p);
  });
}

/* ---------- render stage ---------- */
function renderStage(){
  const level = state.levels[state.stageIndex];
  state.selectedChip = null;
  state.locked = false;
  renderPips();

  els.stageBadge.innerHTML = level.categoryBadge ? `<span class="badge">${level.categoryBadge}</span>` : '';
  els.stageTitle.textContent = level.title;
  els.hint.textContent = 'בחרו תווית ואז הצמידו אותה למקום המתאים';

  els.stageContent.innerHTML = '';

  if(level.type === 'single_image'){
    // תצוגת תמונה אחת עם נקודות פנים
    const wrap = document.createElement('div');
    wrap.className = 'single-image-wrap';
    wrap.innerHTML = `<img src="${level.imageUrl}" alt="">`;

    state.slots = level.targets.map((tgt, idx) => ({
      targetId: tgt.id,
      correctItemId: tgt.correctItemId,
      assigned: null
    }));

    level.targets.forEach((tgt, idx)=>{
      const targetEl = document.createElement('div');
      targetEl.className = 'face-target';
      targetEl.dataset.idx = idx;
      targetEl.style.top = tgt.rect.top;
      targetEl.style.left = tgt.rect.left;
      targetEl.style.width = tgt.rect.width;
      targetEl.style.height = tgt.rect.height;

      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = 'מי זה?';
      targetEl.appendChild(tag);

      targetEl.addEventListener('click', ()=>onSlotTap(idx));
      targetEl.addEventListener('dragover', e=>e.preventDefault());
      targetEl.addEventListener('drop', e=>{
        e.preventDefault();
        const itemId = e.dataTransfer.getData('text/plain');
        if(itemId) assignToSlot(idx, itemId);
      });

      wrap.appendChild(targetEl);
    });

    els.stageContent.appendChild(wrap);
  } else {
    // תצוגת שתי כרטיסיות רגילה
    const row = document.createElement('div');
    row.className = 'cards-row';

    const items = Math.random() < 0.5 ? [level.itemA, level.itemB] : [level.itemB, level.itemA];
    state.slots = items.map(it => ({ correctItemId: it.id, item: it, assigned: null }));

    state.slots.forEach((slot, idx)=>{
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.idx = idx;
      const art = document.createElement('div');
      art.className = 'art';
      if(slot.item.imageUrl){
        const pos = slot.item.focus || 'center';
        art.innerHTML = `<img src="${slot.item.imageUrl}" alt="" style="object-position:${pos};" onerror="this.onerror=null; this.parentElement.textContent='${slot.item.emoji || '🌿'}';">`;
      } else {
        art.textContent = slot.item.emoji || '🌿';
      }
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = 'הצמידו תווית';
      card.appendChild(art);
      card.appendChild(tag);
      card.addEventListener('click', ()=>onSlotTap(idx));
      
      card.addEventListener('dragover', e=>e.preventDefault());
      card.addEventListener('drop', e=>{
        e.preventDefault();
        const itemId = e.dataTransfer.getData('text/plain');
        if(itemId) assignToSlot(idx, itemId);
      });
      row.appendChild(card);
    });

    els.stageContent.appendChild(row);
  }

  // תוויות לבחירה
  const chipItems = Math.random() < 0.5 ? [level.itemA, level.itemB] : [level.itemB, level.itemA];
  els.chipsRow.innerHTML = '';
  chipItems.forEach(it=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = it.name;
    chip.dataset.itemId = it.id;
    chip.draggable = true;
    chip.addEventListener('click', ()=>onChipTap(it.id, chip));
    chip.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', it.id);
    });
    els.chipsRow.appendChild(chip);
  });

  showScreen('PLAYING');
}

function onChipTap(itemId, chipEl){
  if(state.locked) return;
  sfx.click();
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  if(state.selectedChip === itemId){
    state.selectedChip = null;
    return;
  }
  state.selectedChip = itemId;
  chipEl.classList.add('selected');
}

function onSlotTap(idx){
  if(state.locked) return;
  const slot = state.slots[idx];

  if(state.selectedChip){
    assignToSlot(idx, state.selectedChip);
    return;
  }

  if(slot.assigned){
    unassignSlot(idx);
  }
}

function assignToSlot(idx, itemId){
  if(state.locked) return;
  const slot = state.slots[idx];

  if(slot.assigned){
    unassignSlot(idx, false);
  }

  slot.assigned = itemId;

  const slotEl = els.stageContent.querySelector(`[data-idx="${idx}"]`);
  const tag = slotEl.querySelector('.tag');
  const level = state.levels[state.stageIndex];
  const item = level.itemA.id === itemId ? level.itemA : level.itemB;
  tag.textContent = item.name;
  tag.classList.add('filled');
  slotEl.classList.add('selected');

  const chip = [...els.chipsRow.children].find(c=>c.dataset.itemId === itemId);
  if(chip) {
    chip.classList.add('used');
    chip.classList.remove('selected');
  }
  state.selectedChip = null;

  const remaining = state.slots.filter(s=>!s.assigned).length;
  if(remaining === 0){
    state.locked = true;
    els.hint.textContent = 'בודקים תשובה...';
    setTimeout(checkAnswer, 450);
  }
}

function unassignSlot(idx, playSound = true){
  const slot = state.slots[idx];
  if(!slot.assigned) return;

  const oldItemId = slot.assigned;
  slot.assigned = null;

  const slotEl = els.stageContent.querySelector(`[data-idx="${idx}"]`);
  const tag = slotEl.querySelector('.tag');
  const level = state.levels[state.stageIndex];
  tag.textContent = level.type === 'single_image' ? 'מי זה?' : 'הצמידו תווית';
  tag.classList.remove('filled');
  slotEl.classList.remove('selected');

  const chip = [...els.chipsRow.children].find(c=>c.dataset.itemId === oldItemId);
  if(chip) chip.classList.remove('used');

  if(playSound) sfx.click();
}

function checkAnswer(){
  let allCorrect = true;
  state.slots.forEach((slot, idx)=>{
    const slotEl = els.stageContent.querySelector(`[data-idx="${idx}"]`);
    const isCorrect = slot.assigned === slot.correctItemId;
    if(!isCorrect) allCorrect = false;
    slotEl.classList.add(isCorrect ? 'correct' : 'wrong');
  });

  if(allCorrect) state.score++;
  allCorrect ? sfx.correct() : sfx.wrong();

  setTimeout(()=>renderFeedback(allCorrect), 700);
}

function renderFeedback(success){
  const level = state.levels[state.stageIndex];
  els.feedbackEmoji.textContent = success ? '🎉' : '😬';
  els.feedbackTitle.textContent = success ? 'תשובה נכונה!' : 'לא בדיוק...';
  els.feedbackLine.textContent = success ? level.transition.successPunchline : level.transition.failurePunchline;
  if(level.transition.funFact){
    els.funfactBox.style.display = 'block';
    els.funfactLabel.textContent = level.transition.funFactLabel || '👀 הידעת?';
    els.funfactText.innerHTML = level.transition.funFact
      .split('\n')
      .map(line => line.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])))
      .join('<br>');
    if(level.transition.funFactNote){
      els.funfactNote.style.display = 'block';
      els.funfactNote.textContent = level.transition.funFactNote;
    } else {
      els.funfactNote.style.display = 'none';
    }
  } else {
    els.funfactBox.style.display = 'none';
  }
  const isLast = state.stageIndex === state.levels.length - 1;
  document.getElementById('btn-next').textContent = isLast ? 'לתוצאות' : 'לשלב הבא';
  showScreen('STAGE_FEEDBACK');
}

document.getElementById('btn-next').addEventListener('click', ()=>{
  sfx.click();
  const isLast = state.stageIndex === state.levels.length - 1;
  if(isLast){
    renderResults();
  } else {
    state.stageIndex++;
    renderStage();
  }
});

function resultTitleFor(score, total){
  const pct = score / total;
  if(pct === 1) return 'עין של סטוקרית מה-FBI. נדיר 👑 🕵🏼‍♀️';
  if(pct >= 0.5) return '🌿 לא רע בכלל, רוב הזמן אתם בפוקוס';
  return 'יש לכם את העין של עדי ביטי 🧿';
}

function renderResults(){
  els.finalScore.textContent = `${state.score}/${state.levels.length}`;
  els.resultsTitle.textContent = resultTitleFor(state.score, state.levels.length);
  showScreen('GAME_OVER');
}

document.getElementById('btn-restart').addEventListener('click', ()=>{
  state.stageIndex = 0;
  state.score = 0;
  showScreen('START_SCREEN');
});

document.getElementById('btn-share').addEventListener('click', async ()=>{
  const text = `קיבלתי ${state.score}/${state.levels.length} במשחק "כוסברה או פטרוזיליה?" 🌿 בואו תנסו גם אתם!`;
  if(navigator.share){
    try{ await navigator.share({ text }); }catch(e){}
  } else {
    try{
      await navigator.clipboard.writeText(text);
      alert('התוצאה הועתקה! אפשר להדביק ולשתף.');
    }catch(e){
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
  }
});

document.getElementById('btn-start').addEventListener('click', ()=>{
  sfx.click();
  state.levels = buildGameLevels();
  state.stageIndex = 0;
  state.score = 0;
  renderStage();
});
</script>
